<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>GroupIt</title>

  <!--
    ─────────────────────────────────────────────────────────────────────────────────────────
    GroupIt's WebGL template. Added 2026-09-23 with the browser build.

    **It exists for one reason: this game is portrait and a browser window is not.** Unity's
    Default template hands the canvas whatever box the page gives it and lets the engine stretch
    to fill it, which on a desktop monitor means a 16:9 canvas showing a UI laid out against
    1080x1920 — every screen in the game squeezed into a strip down the middle of a stretched
    one, with the CanvasScaler's match mode splitting the difference and making it worse. There
    is no player setting that fixes that; the canvas element's size is the page's business, so
    the page is where it is decided.

    What this does: sizes the canvas to the tallest 9:16 box that fits the window, centres it on
    a light surround, and goes edge-to-edge where the window is ALREADY portrait — which is every
    phone, and is where a letterbox would be throwing away screen for nothing.

    Everything the page needs to draw is inline. Since 2026-11-26 the folder also ships three
    files that sit beside it in play/ (Unity copies a template folder's files into the build):
    manifest.webmanifest, icon-192.png / icon-512.png for it, and apple-touch-icon.png, so "Add to
    Home Screen" makes a full-screen portrait app with the game's own icon. A template that
    references a file it does not ship produces a 404 in every player's console, so every file
    this page names is in this folder; the loader's icon is inline, so it never waits on one.

    2026-11-26, the phone pass (scout report webgl-mobile): the light loader and frame (the game is
    light-only, so a dark loader jumped to cream on every load and tinted the iOS status bar dark);
    no text selection, no iOS callout and no context menu on the game, because a long press is a
    move here (hold for Light) — before this only the portal builds had those guards; the safe
    area and the dynamic viewport; Safari's own App Store banner; and a rotate cue for a phone held
    sideways.
    ─────────────────────────────────────────────────────────────────────────────────────────
  -->

  <!--
    height=device-height and viewport-fit=cover are the two that matter on a phone. Without the
    first, iOS Safari reports a viewport that includes the space its toolbars are about to take,
    and the bottom of the game sits under them; without the second the canvas stops at the safe
    area and leaves white bars on a notched device. user-scalable=no is here because this game is
    played by dragging across a grid, and a pinch that zooms the PAGE instead of being delivered
    to the canvas reads as the game ignoring the player.
  -->
  <meta name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F6F3EA">
  <meta name="color-scheme" content="light">
  <meta name="description" content="A binary-grid deduction puzzle. Every cell is Light or Shadow.">

  <!--
    Safari's own banner for the app (iOS and iPadOS): Apple draws it, with the App Store's install
    button, above the page. fit() refits when it moves the viewport (the visualViewport listener).
  -->
  <meta name="apple-itunes-app" content="app-id=6801780198">

  <!-- Add to Home Screen: a full-screen portrait app, the game's icon, the day backdrop behind it.
       All three files ship in this template's folder, beside the page. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!--
    An inline favicon. A browser asks for /favicon.ico whether or not a page mentions one, so the
    choice is between shipping a file, declaring a data URI, or taking a 404 on every load. The
    mark is the game's own: a dark ground, one lit square and one shadowed one.
  -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B1D22'/%3E%3Crect x='6' y='6' width='9' height='9' rx='2' fill='%23F0F1EC'/%3E%3Crect x='17' y='17' width='9' height='9' rx='2' fill='%235F6573'/%3E%3C/svg%3E">

  <style>
    /*
      The game is light-only (Palette.NightParked), so the page is the day frame: the canvas is the
      day backdrop (Look.DayBackdrop, #F6F3EA), and the letterbox surround one step darker than it,
      not equal — equal would make a desktop letterbox invisible and the game look like a window that
      had failed to fill the screen; a step darker reads as a frame. Where the canvas fills the window
      (every phone held upright) there is no letterbox, and the surround takes the canvas's colour
      (body.fill), so the safe-area bands above and below the game are the game's own paper. The
      ink and muted ink are Look.DayInk and Look.DayMuted. (It was the night frame, a near-black surround round the night backdrop, until 2026-11-26.)
    */
    :root {
      --surround: #E9E4D6;
      --canvas: #F6F3EA;
      --ink: #2A1A5E;
      --muted: #655E7C;
      --track: rgba(42, 26, 94, 0.14);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--surround);
      /* The page never scrolls. A drag that starts on the canvas and leaves it must not become a
         page scroll halfway through a fence of cells. */
      overflow: hidden;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--muted);
      /* A long press is a move in this game (hold for Light). Without these, iOS Safari answers a
         hold by selecting the page and raising its Copy / Look Up callout over the board, and
         Android raises its own. The portal builds inject the same rule from the jslib
         (InstallGuards); this page is the site build's, so it says it here. */
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body.fill { background: var(--canvas); }

    /*
      The game's box: the DYNAMIC viewport (100dvh: the height left once a phone's toolbars have
      taken theirs, which changes as they slide; 100vh first for a browser that has no dvh), padded
      by the safe area so no key sits under a notch or a home indicator (viewport-fit=cover hands
      the page the whole screen, env() says which part of it is safe). fit() sizes the canvas to the
      box INSIDE that padding.
    */
    #unity-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 100vh;
      height: 100dvh;
      box-sizing: border-box;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
               env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #unity-canvas {
      display: block;
      background: var(--canvas);
      /* Every pointer event belongs to the game. Without this the browser claims drags for
         scrolling and pinches for zooming, and both of those are gestures this game uses. */
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      outline: none;
    }

    /* ── the rotate cue ──────────────────────────────────────────────────────────────────────
       A phone held sideways gets the 9:16 box in the middle of a wide screen, which is a small game.
       A picture says "turn it" without a word: a phone outline and a quarter-turn arrow, in the
       letterbox to the right of the game, never over it and never taking a finger. Only on a touch
       device (pointer: coarse), so a desktop's wide window — the normal shape there — shows nothing. */
    #rotate { display: none; }

    @media (pointer: coarse) and (orientation: landscape) {
      #rotate {
        display: flex;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: calc((100vw - 56.25vh) / 2);
        width: calc((100vw - 56.25dvh) / 2);
        align-items: center;
        justify-content: center;
        pointer-events: none;
        color: var(--muted);
      }
      #rotate svg { width: 56px; height: 56px; }
    }

    /* ── the loading state ────────────────────────────────────────────────────────────────
       Drawn on the page rather than by the engine, because the engine is what is loading. It
       is deliberately quiet: a name, a hairline bar and nothing else. A spinner or a percentage
       counter on a two-second load is motion that says "this is slow". */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      /* The canvas's paper, not the surround: the game draws its first frame in this colour, so the
         loader leaves without a flash. */
      background: var(--canvas);
      transition: opacity 260ms ease;
    }

    #loading.gone { opacity: 0; pointer-events: none; }

    #loading .icon {
      width: 88px;
      height: 88px;
      border-radius: 22%;
      box-shadow: 0 6px 18px rgba(42, 26, 94, 0.16);
    }

    #loading .name {
      font-size: 20px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink);
    }

    #loading .track {
      width: 180px;
      height: 3px;
      border-radius: 2px;
      background: var(--track);
      overflow: hidden;
    }

    /* The one line of text: what the wait is. Measured 2026-11-26 (Web/README.md): 26 MB on a first
       visit, then from the browser's cache. */
    #loading .size {
      font-size: 13px;
      color: var(--muted);
    }

    #loading .fill {
      width: 0%;
      height: 100%;
      background: var(--ink);
      transition: width 120ms linear;
    }

    /* Unity calls showBanner for its own warnings and errors. Kept, because a build that cannot
       start should say so on the page rather than only in a console the player will not open. */
    #banner {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
      background: #E9E4D6;
      color: var(--ink);
      display: none;
    }
  </style>
</head>

  <div id="banner"></div>

  <!--
    Web analytics (round 35, 2026-10-05). DARK until the site's web/src/ui/analyticsConfig.ts carries a
    measurement id; with none, the only thing this does is fetch one small first-party file and do nothing
    with it (no Google request, no storage, no banner). With an id, analytics.js asks the visitor first and
    sends nothing until they accept.

    It is its own <script>, apart from the loader below, so that a browser which refuses the syntax of a
    dynamic import cannot take the game's loader down with it. analytics.js is the same module the landing
    and shared-board pages use: it lives at <site>/app/ui/analytics.js, which is why this page reaches it
    by a relative path and why Web/tools/deploy.sh (which replaces app/ on every deploy) is what delivers
    it. If it is missing, the import fails quietly and the game does not notice.

    Only fixed words go through it (web_play_ready with a load-time bucket, web_play_failed with
    "loader" or "engine"). This page never passes its own address, its fragment or any text.
  -->
  <script>
    var giModule = null;      // analytics.js, once it has loaded
    var giWaiting = [];       // things to report before it has, kept in memory only
    function giWhenReady(fn) {
      if (giModule !== null) fn(giModule);
      else if (giWaiting.length < 8) giWaiting.push(fn);
    }
  </script>
  <script>
    try {
      import("../app/ui/analytics.js").then(function (m) {
        giModule = m;
        m.start("play");
        giWaiting.splice(0).forEach(function (fn) { fn(m); });
      }).catch(function () { giWaiting.length = 0; });
    } catch (e) { giWaiting.length = 0; }
  </script>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#loading");
    var loadingFill = document.querySelector("#loading-fill");
    var banner = document.querySelector("#banner");

    // ── the portrait fit ──────────────────────────────────────────────────────────────────
    //
    // The game is laid out against 1080x1920 and locked to portrait on both phones. In a browser
    // there is no orientation to lock, so the SHAPE OF THE CANVAS is the lock: give it 9:16 and
    // the game inside it is the game that ships.
    //
    // Two cases, and the second is not a special case bolted on — it is the majority of the
    // traffic a free web build gets. A window that is already at least as tall as 9:16 is a
    // phone in portrait, or a tall desktop window, and there the canvas takes the whole viewport:
    // letterboxing a phone would throw away the only screen it has in order to enforce a ratio it
    // already has. A wider window gets the tallest 9:16 box that fits, centred.
    //
    // Only the CSS size is set. Unity reads the canvas's client size and sizes its own drawing
    // buffer from it, devicePixelRatio included, so setting the buffer here as well would fight
    // the engine for it and produce a blurry canvas on every retina display.
    var ASPECT = 9 / 16;

    // The box inside the container's safe-area padding: clientWidth and clientHeight include the
    // padding, and the canvas must not.
    function inner() {
      var cs = window.getComputedStyle(container);
      var w = container.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
      var h = container.clientHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
      return { w: Math.floor(w), h: Math.floor(h) };
    }

    function fit() {
      var box = inner();
      var w = box.w;
      var h = box.h;
      if (w <= 0 || h <= 0) return;

      var width, height;
      var filled = w / h <= ASPECT;
      // No letterbox: the surround takes the canvas's own colour (see body.fill in the style).
      document.body.classList.toggle("fill", filled);
      if (filled) {
        // Already portrait enough: fill it. Rounding down on the height rather than the width,
        // because a half-pixel of overflow on the tall axis is what produces a scrollbar on a
        // desktop browser and a rubber-band bounce on a phone.
        width = w;
        height = h;
      } else {
        height = h;
        width = Math.round(h * ASPECT);
      }

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
    }

    fit();
    window.addEventListener("resize", fit);
    // orientationchange fires before the new viewport size is readable on iOS, so the resize
    // listener above is what actually does the work there; this is the belt to its braces on
    // Android browsers that do not fire resize on a rotation with the same dimensions.
    window.addEventListener("orientationchange", function () { setTimeout(fit, 120); });
    // A phone's toolbars sliding, Safari's app banner arriving or leaving, a pinch the page refused:
    // each moves the VISUAL viewport, which a window resize does not always report. The size still
    // comes from the 100dvh container rather than from visualViewport.height, so an on-screen
    // keyboard (the name sheet) does not shrink the game under it.
    if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);

    // A long press is a move (hold for Light), so the browser's context menu must never open over the
    // game — on a phone it is the long-press menu, on a desktop the right click. Unity's loader blocks
    // it on the canvas once the engine is up; this covers the page around it and the load before.
    container.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    // ── Unity's own banner ────────────────────────────────────────────────────────────────
    function unityShowBanner(msg, type) {
      banner.style.display = "block";
      banner.textContent = msg;
      if (type === "error") banner.style.background = "#F4D6D3";
      if (type === "warning") setTimeout(function () { banner.style.display = "none"; }, 5000);
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebGL.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "zeroplusplus",
      productName: "GroupIt",
      productVersion: "1.1",
      showBanner: unityShowBanner,
    };

    // devicePixelRatio is left at the engine's default on every device, including phones.
    // Unity's own template caps it at 1 on mobile as a performance measure; this game draws a
    // few hundred flat uGUI quads and no lighting, so the frame cost of a real retina buffer is
    // not the bottleneck, and the thing it would cost instead — crisp small numerals printed on
    // cells — is the thing the player spends the whole game reading.

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        loadingFill.style.width = (100 * progress) + "%";
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance;
        var readyAfter = performance.now();   // ms since this page began to load
        giWhenReady(function (m) { m.track("web_play_ready", { tb: m.loadBucket(readyAfter) }); });
        loading.className = "gone";
        // Removed rather than left transparent: an invisible full-screen div still takes the
        // first press, and on this game the first press is a menu button.
        setTimeout(function () { loading.parentNode.removeChild(loading); }, 320);
        fit();
      }).catch(function (message) {
        unityShowBanner(message, "error");
        giWhenReady(function (m) { m.track("web_play_failed", { why: "engine" }); });
      });
    };
    script.onerror = function () {
      unityShowBanner("Could not load the player (" + loaderUrl + ").", "error");
      giWhenReady(function (m) { m.track("web_play_failed", { why: "loader" }); });
    };
    // 2026-10-05: a link pasted into a tab that already holds the game changes only the URL fragment, so
    // the page does not reload, and Application.deepLinkActivated never fires in a browser (measured on the
    // 2026-09-23 build): the pasted board was silently ignored and the old one stayed. The shared-board page
    // (b/) already reloads on hashchange for the same reason; a reload re-runs the cold-start link path.
    window.addEventListener("hashchange", function () { location.reload(); });
    document.body.appendChild(script);
  </script>
